<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="../style.css">
</head>


<body>
    <main>
        <h1>Settings</h1>
        
        <div class="theme-buttons">
            <button type="button" id="light-button">Light</button>
            <button type="button" id="dark-button">Dark</button>
        </div>


        <div class="text-setting">
            <label for="text-size">Text Size</label>
            
            <div class="text-slider">
                <span>Small</span>
                <input type="range" id="text-size" min="90" 
                max="110" step="5" value="100">
                <span>Large</span>
            </div>

            <p id="text-value">100%</p>
        </div>
    </main>
    
    <a href="../index.html" class="home-button">Home</a>
    <script src="../settings.js"></script>

</body>
</html>
