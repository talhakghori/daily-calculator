<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <title>Loan</title>
    <link rel="stylesheet" href="../style.css">
</head>


<body>
    <main>
        <h1>Loan / Payment</h1>

        <div class="loan-form">
            <label for="loan-amount">Loan Amount ($)</label>
            <input type="number" id="loan-amount" min="1" 
            max="1000000000" step="0.01">

            <label for="interest-rate">Annual Interest Rate (%)</label>
            <input type="number" id="interest-rate" min="0"
            max="100" step="0.01">

            <label for="loan-term">Loan Term (Years)</label>
            <input type="number" id="loan-term" min="1" 
            max="100" step="1">
        </div>

        <div class="loan-result" id="loan-result"></div>
        
        <button type="button" class="calculate-button" 
        id="calculate-button">Calculate</button>
    </main>
    

    <a href="../index.html" class="home-button">Home</a>
    <script src="../loan.js"></script>
    <script src="../settings.js"></script>

</body>
</html>
