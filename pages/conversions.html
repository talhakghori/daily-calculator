<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <title>Conversions</title>
    <link rel="stylesheet" href="../style.css">
</head>


<body data-title-key="conversionsTitle">
    <main>
        <h1 data-translate="conversionsTitle">Conversions</h1>

        <div class="conversion-option">
            <button type="button" id="metric-button"
            data-translate="metric">Metric</button>

            <button type="button" id="imperial-button"
            data-translate="imperial">Imperial</button>
        </div>


        <div class="conversion-table">

            <div class="conversion-row">
                <div>
                    <label for="km" data-translate="kilometers">
                        Kilometers</label>
                    <input type="number" id="km" step="0.1">
                </div>

                <div>
                    <label for="miles" data-translate="miles">
                        Miles</label>
                    <input type="text" id="miles" readonly>
                </div>
            </div>


            <div class="conversion-row">
                <div>
                    <label for="meters" data-translate="meters">
                        Meters</label>
                    <input type="number" id="meters" step="0.1">
                </div>

                <div>
                    <label for="ft" data-translate="feet">
                        Feet</label>
                    <input type="text" id="ft" readonly>
                </div>
            </div>


            <div class="conversion-row">
                <div>
                    <label for="cm" data-translate="centimeters">
                        Centimeters</label>
                    <input type="number" id="cm" step="0.1">
                </div>

                <div>
                    <label for="in" data-translate="inches">
                        Inches</label>
                    <input type="text" id="in" readonly>
                </div>
            </div>


            <div class="conversion-row">
                <div>
                    <label for="kg" data-translate="kilograms">
                        Kilograms</label>
                    <input type="number" id="kg" step="0.1">
                </div>

                <div>
                    <label for="pounds" data-translate="pounds">
                        Pounds</label>
                    <input type="text" id="pounds" readonly>
                </div>
            </div>


            <div class="conversion-row">
                <div>
                    <label for="celsius" data-translate="celsius">
                        Celsius</label>
                    <input type="number" id="celsius" step="0.1">
                </div>

                <div>
                    <label for="f" data-translate="fahrenheit">
                        Fahrenheit</label>
                    <input type="text" id="f" readonly>
                </div>
            </div>

            
            <div class="conversion-row">
                <div>
                    <label for="litres" data-translate="litres">
                        Litres</label>
                    <input type="number" id="litres" step="0.1">
                </div>

                <div>
                    <label for="gallons" data-translate="gallons">
                        US Gallons</label>
                    <input type="text" id="gallons" readonly>
                </div>
            </div>


        </div>
        <button type="button" class="convert-button" 
        id="convert-button" data-translate="convert">
        Convert</button>
    </main>
    

    <a href="../index.html" class="home-button" 
    data-translate="home">Home</a>

    <script src="../settings.js"></script>
    <script src="../conversions.js"></script>

</body>
</html>
